  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(ENC.iv) }, key, u8(ENC.ct));
  const html = new TextDecoder().decode(pt);
  try { sessionStorage.setItem('belle_pw', pw); } catch (e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById('gate').addEventListener('submit', async e => {
  e.preventDefault(); const btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.textContent = 'Opening…'; btn.disabled = true; err.hidden = true;
  try { await openPacket(document.querySelector('input[name=password]').value); }
  catch (x) { err.hidden = false; btn.textContent = 'Open packet'; btn.disabled = false; }
});
try { const s = sessionStorage.getItem('belle_pw'); if (s) openPacket(s).catch(() => {}); } catch (e) {}
</script>
